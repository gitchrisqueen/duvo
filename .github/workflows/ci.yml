name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Compression is for interactive agent runs. Continuous integration reads its
  # own output, so it runs without it.
  CAVEMAN_DISABLE: "1"

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Format and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Documentation reads as full English
        # Compressed prose can never reach a reviewer: it fails the build here.
        run: uv run python -m tools.prose_guard $(git ls-files '*.md' | grep -v '^tests/fixtures/')

      - name: The prose guard actually rejects compressed prose
        # A guard that has only been configured is a claim. This proves it works
        # by pointing it at a document written to fail.
        run: |
          if uv run python -m tools.prose_guard tests/fixtures/terse_example.md; then
            echo "The prose guard accepted a deliberately compressed document. It is broken."
            exit 1
          fi
          echo "The prose guard rejected the compressed fixture, as it must."

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: The fast suite stays fast
        # A slow suite stops being run at commit time, and a suite that stops
        # being run stops being true.
        run: |
          start=$(date +%s%N)
          uv run pytest -q -m "not slow" >/dev/null
          elapsed=$((($(date +%s%N) - start) / 1000000))
          echo "fast suite: ${elapsed}ms"
          if [ "$elapsed" -gt 10000 ]; then
            echo "The fast suite took ${elapsed}ms, over the 10s ceiling. Make it faster."
            exit 1
          fi

  container:
    name: image builds and the stack actually works
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          tags: duvo-fde:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the mock upstream image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: mock
          tags: duvo-fde-mock:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create a local key for the stack
        run: |
          mkdir -p secrets
          python3 -c "import secrets, pathlib; pathlib.Path('secrets/upstream_api_key').write_text('ci-' + secrets.token_hex(16))"

      - name: Start the stack
        run: docker compose up --detach --wait --wait-timeout 120

      - name: Smoke test the running stack
        # This exercises the path a reviewer takes, not a path that only exists
        # on a developer machine.
        run: ./scripts/smoke.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 100

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
