name: security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CAVEMAN_DISABLE: "1"

jobs:
  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks reads the pull request's commits to scan exactly what changed.
      # Without this it fails on the API call rather than on a finding.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        # Offline, fast, and covers the whole history rather than the diff.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitGuardian
        # Guarded so that a missing key skips the scan rather than failing the
        # build. A scan that could not run is not a finding.
        if: ${{ env.GITGUARDIAN_API_KEY != '' }}
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        uses: GitGuardian/ggshield-action@v1

  static-analysis:
    name: static analysis and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: bandit
        run: uv run bandit -q -c pyproject.toml -r src tools

      - name: pip-audit
        # Audits the lock file rather than the environment, so it covers exactly
        # what a deployment installs.
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes -q -o requirements.audit.txt
          uv run pip-audit --strict --progress-spinner off -r requirements.audit.txt

  dependency-review:
    name: dependency review
    # Like code scanning, this needs Advanced Security and is unavailable on a
    # private repository. It skips rather than pretending to have reviewed
    # anything, and runs by itself once the repository is public.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
