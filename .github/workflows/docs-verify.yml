name: docs-verify

# Documentation is a claim, and a claim nobody checks is a liability. Every
# shell block marked with <!-- verify --> is executed here, so a documented
# command cannot quietly stop working.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CAVEMAN_DISABLE: "1"

jobs:
  documented-commands:
    name: every documented command runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: List what is marked for verification
        run: uv run python -m tools.doc_verifier $(git ls-files '*.md' | grep -v '^tests/fixtures/') --list

      - name: Run every marked command
        run: uv run python -m tools.doc_verifier $(git ls-files '*.md' | grep -v '^tests/fixtures/') --root "$PWD"

      - name: Documentation reads as full English
        run: uv run python -m tools.prose_guard $(git ls-files '*.md' | grep -v '^tests/fixtures/') --verbose
