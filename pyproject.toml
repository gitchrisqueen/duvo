[project]
name = "duvo-fde"
version = "0.1.0"
description = "Forward Deployed Engineer exercise: a task-focused tool server with deterministic business logic."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Christopher Queen", email = "christopher.queen@gmail.com" }]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.optional-dependencies]
# The mock upstream service used by docker compose and the smoke test.
mock = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[project.scripts]
duvo-fde = "duvo_fde.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "pytest-httpx>=0.31",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duvo_fde"]

# ---------------------------------------------------------------------------
# Ruff: linting + formatting + Google-style docstring enforcement.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "D",         # pydocstyle (Google convention, see below)
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "S",         # flake8-bandit
    "BLE",       # flake8-blind-except
    "T20",       # flake8-print (no stray prints in library code)
    "SIM",       # flake8-simplify
    "ARG",       # flake8-unused-arguments
    "PTH",       # flake8-use-pathlib
    "RUF",       # ruff-specific
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "S101",   # assert is expected in tests; scoped off below for src
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "S", "ARG"]
"src/duvo_fde/__main__.py" = ["T20"]
# The repository tooling is a set of command line programs. Printing is how
# they report, and the word list in prose_guard is written as prose on purpose
# so that it stays readable and editable.
"tools/**" = ["T20", "SIM905"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: strict on our own code.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest: fast by construction. The suite must stay under 5 seconds.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --timeout=15"
markers = [
    "slow: excluded from the fast suite used at commit time",
    "integration: requires docker compose or a live upstream",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/duvo_fde"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
# Global floor is deliberately modest. The critical path is gated separately in
# scripts/test_all.sh, because a high global number invites coverage theatre.
fail_under = 70

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
